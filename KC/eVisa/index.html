<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電子簽證編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
  :root{
    --accent:#0067c0;
    --accent-hover:#0757a3;
    --bg:#f3f3f3;
    --panel:#ffffff;
    --border:#e2e2e2;
    --text:#1b1b1b;
    --sub:#6b6b6b;
    --radius-lg:12px;
    --radius-md:8px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"可画隶正黑-简","Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .titlebar{
    padding:14px 22px;
    font-size:15px;
    font-weight:600;
    background:#ffffffcc;
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .layout{
    flex:1;
    display:flex;
    gap:16px;
    padding:16px;
  }
  @media (max-width:900px){
    .layout{flex-direction:column;}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    width:340px;
    flex-shrink:0;
    overflow-y:auto;
    max-height:calc(100vh - 80px);
  }
  @media (max-width:900px){
    .panel{width:100%;max-height:none;}
  }
  .panel h2{
    font-size:14px;
    font-weight:700;
    margin:0 0 14px 0;
    color:var(--text);
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--sub);
    margin-bottom:6px;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field select,
  .field textarea{
    width:100%;
    padding:9px 10px;
    font-size:13.5px;
    font-family:inherit;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:#fafafa;
    color:var(--text);
    outline:none;
    transition:border-color .15s;
  }
  .field textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    border-color:var(--accent);
    background:#ffffff;
  }
  .avatar-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .avatar-thumb{
    width:56px;height:64px;
    border-radius:6px;
    object-fit:cover;
    border:1px solid var(--border);
    background:#e9eef7;
  }
  .avatar-thumb.hidden{display:none;}
  .btn-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  button{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:#f6f6f6;
    color:var(--text);
    cursor:pointer;
    transition:background .12s,border-color .12s;
  }
  button:hover{background:#ececec;}
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  button.primary:hover{background:var(--accent-hover);}
  button.secondary{
    background:#fff;
  }
  button.hidden{display:none;}
  hr.sep{
    border:none;
    border-top:1px solid var(--border);
    margin:16px 0;
  }
  .preview-area{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:8px;
  }
  .canvas-wrap{
    width:100%;
    max-width:820px;
    border-radius:16px;
    padding:28px;
    background-image:
      linear-gradient(45deg,#e9e9e9 25%,transparent 25%),
      linear-gradient(-45deg,#e9e9e9 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#e9e9e9 75%),
      linear-gradient(-45deg,transparent 75%,#e9e9e9 75%);
    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0;
    background-color:#f7f7f7;
    border:1px solid var(--border);
  }
  #cardCanvas{
    display:block;
    width:100%;
    height:auto;
    border-radius:0;
  }
  .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .hint{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
    line-height:1.5;
  }
  /* crop modal */
  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
  }
  .modal.hidden{display:none;}
  .modal-card{
    background:#fff;
    border-radius:var(--radius-lg);
    padding:20px;
    width:340px;
    max-width:92vw;
    box-shadow:0 8px 28px rgba(0,0,0,0.18);
  }
  .modal-card h3{
    margin:0 0 14px 0;
    font-size:15px;
    font-weight:700;
  }
  #cropCanvas{
    display:block;
    margin:0 auto;
    border-radius:8px;
    background:#222;
    touch-action:none;
    cursor:grab;
  }
  .zoom-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }
  .zoom-row span{font-size:12.5px;color:var(--sub);width:32px;}
  .zoom-row input[type="range"]{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:16px;
  }
  @media print{
    body *{visibility:hidden;}
    .canvas-wrap, .canvas-wrap *{visibility:visible;}
    .canvas-wrap{
      position:absolute;left:0;top:0;width:100%;
      padding:0;border:none;background:none;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">電子簽證編輯器</div>
  <div class="layout">
    <aside class="panel">
      <h2>頭像</h2>
      <div class="avatar-row">
        <img id="avatarThumb" class="avatar-thumb hidden" alt="頭像預覽">
        <div class="btn-group">
          <button id="btnChooseAvatar">選擇頭像</button>
          <button id="btnChangeAvatar" class="hidden">更換照片</button>
          <button id="btnRecrop" class="hidden">重新裁切</button>
        </div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" hidden>

      <hr class="sep">

      <h2>基本資料</h2>
      <div class="field">
        <label>姓名</label>
        <input type="text" id="inpName" value="Mason">
      </div>
      <div class="field">
        <label>性別</label>
        <select id="inpGender">
          <option value="男性">男性</option>
          <option value="女性">女性</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="field">
        <label>出生日期</label>
        <input type="date" id="inpBirth" value="2009-08-10">
      </div>

      <hr class="sep">

      <h2>簽證資料</h2>
      <div class="field">
        <label>簽證編號</label>
        <input type="text" id="inpVisaNumber" value="KC-26-0730-PD">
      </div>
      <div class="field">
        <label>電子編號</label>
        <input type="text" id="inpENumber" value="eVisa-KC-26-003">
        <div class="hint" style="margin-top:6px;">條碼內容會自動與電子編號同步。</div>
      </div>
      <div class="field">
        <label>備註</label>
        <input type="text" id="inpNote" value="無">
      </div>

      <hr class="sep">

      <div class="hint">國旗、國家名稱、電子簽證/eVisa 副標題與底部說明文字為固定背景圖片，不可編輯。修改上方欄位後，右側預覽會即時更新。</div>
    </aside>

    <main class="preview-area">
      <div class="canvas-wrap">
        <canvas id="cardCanvas" width="1600" height="1010"></canvas>
      </div>
      <div class="actions">
        <button id="btnDownload" class="primary">下載 PNG</button>
        <button id="btnPrint" class="secondary">列印</button>
        <button id="btnReset" class="secondary">重設</button>
      </div>
    </main>
  </div>
</div>

<!-- crop modal -->
<div id="cropModal" class="modal hidden">
  <div class="modal-card">
    <h3>裁切頭像</h3>
    <canvas id="cropCanvas" width="300" height="348"></canvas>
    <div class="zoom-row">
      <span>縮放</span>
      <input type="range" id="zoomSlider" min="0" max="100" value="0">
    </div>
    <div class="modal-actions">
      <button id="btnCancelCrop" class="secondary">取消</button>
      <button id="btnApplyCrop" class="primary">套用</button>
    </div>
  </div>
</div>

<canvas id="barcodeSource" width="600" height="140" style="display:none;"></canvas>

  bgImage.onload = ()=>{ bgImageReady = true; scheduleRender(); };
  bgImage.src = BG_IMAGE_SRC;

  /* ---------------------------------------------------------
     Helpers: rounded rect / text wrap / maple leaf / crown
  --------------------------------------------------------- */
  function roundRect(ctx,x,y,w,h,r){
    if (typeof r === "number") r = {tl:r,tr:r,br:r,bl:r};
    ctx.beginPath();
    ctx.moveTo(x+r.tl, y);
    ctx.lineTo(x+w-r.tr, y);
    ctx.arcTo(x+w, y, x+w, y+r.tr, r.tr);
    ctx.lineTo(x+w, y+h-r.br);
    ctx.arcTo(x+w, y+h, x+w-r.br, y+h, r.br);
    ctx.lineTo(x+r.bl, y+h);
    ctx.arcTo(x, y+h, x, y+h-r.bl, r.bl);
    ctx.lineTo(x, y+r.tl);
    ctx.arcTo(x, y, x+r.tl, y, r.tl);
    ctx.closePath();
  }

  function drawMapleLeafPath(ctx, cx, cy, s, color){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,-1);
    ctx.lineTo(0.15,-0.55);
    ctx.lineTo(0.45,-0.65);
    ctx.lineTo(0.3,-0.35);
    ctx.lineTo(0.65,-0.25);
    ctx.lineTo(0.35,-0.05);
    ctx.lineTo(0.55,0.15);
    ctx.lineTo(0.25,0.15);
    ctx.lineTo(0.3,0.55);
    ctx.lineTo(0.08,0.3);
    ctx.lineTo(0,0.6);
    ctx.lineTo(-0.08,0.3);
    ctx.lineTo(-0.3,0.55);
    ctx.lineTo(-0.25,0.15);
    ctx.lineTo(-0.55,0.15);
    ctx.lineTo(-0.35,-0.05);
    ctx.lineTo(-0.65,-0.25);
    ctx.lineTo(-0.3,-0.35);
    ctx.lineTo(-0.45,-0.65);
    ctx.lineTo(-0.15,-0.55);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawCrownMini(ctx, cx, cy, s, color){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-0.6,0.3);
    ctx.lineTo(-0.6,-0.1);
    ctx.lineTo(-0.3,0.15);
    ctx.lineTo(0,-0.35);
    ctx.lineTo(0.3,0.15);
    ctx.lineTo(0.6,-0.1);
    ctx.lineTo(0.6,0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight, align){
    let line = "";
    let curY = y;
    const chars = String(text || "").split("");
    function drawLine(l, yy){
      if (align === "center"){
        const w = ctx.measureText(l).width;
        ctx.fillText(l, x + (maxWidth - w)/2, yy);
      } else {
        ctx.fillText(l, x, yy);
      }
    }
    for (let i=0;i<chars.length;i++){
      const test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line !== ""){
        drawLine(line, curY);
        line = chars[i];
        curY += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) drawLine(line, curY);
    return curY;
  }

  function centerText(ctx, text, xStart, xEnd, y){
    const w = ctx.measureText(text).width;
    const x = xStart + ((xEnd - xStart) - w) / 2;
    ctx.fillText(text, Math.max(xStart, x), y);
  }

  function drawImageCover(ctx, img, x, y, w, h){
    const ir = img.width / img.height;
    const tr = w / h;
    let sx, sy, sw, sh;
    if (ir > tr){
      sh = img.height;
      sw = sh * tr;
      sx = (img.width - sw) / 2;
      sy = 0;
    } else {
      sw = img.width;
      sh = sw / tr;
      sx = 0;
      sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function formatDateDisplay(v){
    if (!v) return "";
    const parts = v.split("-").map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return v;
    const [y,m,d] = parts;
    return `${y}/${m}/${d}`;
  }

  function drawGrid(ctx, W, H){
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.38)";
    ctx.lineWidth = 2;
    ctx.translate(W/2, H/2);
    ctx.rotate(Math.PI/4);
    const diag = Math.sqrt(W*W + H*H);
    const step = 46;
    for (let x = -diag; x <= diag; x += step){
      ctx.beginPath();
      ctx.moveTo(x, -diag);
      ctx.lineTo(x, diag);
      ctx.stroke();
    }
    for (let y = -diag; y <= diag; y += step){
      ctx.beginPath();
      ctx.moveTo(-diag, y);
      ctx.lineTo(diag, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLogo(ctx, x, y, w, h){
    roundRect(ctx, x, y, w, h, 14);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.save();
    roundRect(ctx, x, y, w, h, 14);
    ctx.clip();
    ctx.fillStyle = "#1b3f94";
    ctx.fillRect(x, y, w, h*0.18);
    ctx.fillRect(x, y + h*0.82, w, h*0.18);
    ctx.restore();
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 2;
    roundRect(ctx, x, y, w, h, 14);
    ctx.stroke();

    const cx = x + w/2, cy = y + h/2, r = h*0.34;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = "#f6efd9";
    ctx.fill();
    ctx.strokeStyle = "#c8a94b";
    ctx.lineWidth = Math.max(2, h*0.02);
    ctx.stroke();

    drawMapleLeafPath(ctx, cx, cy + r*0.14, r*0.85, "#d52b1e");
    drawCrownMini(ctx, cx, cy - r*0.78, r*0.5, "#c8a94b");
  }

  function drawField(ctx, W, H, label, value, x, rowIndex, colWidth){
    const rowY = H*0.30 + rowIndex*H*0.135;
    ctx.fillStyle = "#101010";
    ctx.font = `700 ${Math.round(H*0.033)}px ${FONT_STACK}`;
    ctx.fillText(label, x, rowY);
    ctx.font = `400 ${Math.round(H*0.043)}px ${FONT_STACK}`;
    ctx.fillText(value || "", x, rowY + H*0.062);
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, rowY + H*0.088);
    ctx.lineTo(x + colWidth, rowY + H*0.088);
    ctx.stroke();
  }

  function generateBarcode(){
    try{
      const text = state.eNumber && state.eNumber.trim() ? state.eNumber.trim() : "0000000000";
      window.JsBarcode(barcodeSource, text, {
        format:"CODE128",
        width:3,
        height:110,
        displayValue:false,
        margin:0,
        background:"#ffffff",
        lineColor:"#000000"
      });
    }catch(e){
      const bctx = barcodeSource.getContext("2d");
      bctx.clearRect(0,0,barcodeSource.width, barcodeSource.height);
    }
  }

  function drawBarcodeBox(ctx, W, H, x, y, w, h, text){
    roundRect(ctx, x, y, w, h, 6);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 2;
    roundRect(ctx, x, y, w, h, 6);
    ctx.stroke();

    if (barcodeSource.width > 0){
      const bw = w*0.92, bh = h*0.60;
      ctx.drawImage(barcodeSource, x + (w-bw)/2, y + h*0.08, bw, bh);
    }
    ctx.fillStyle = "#101010";
    ctx.font = `700 ${Math.round(H*0.028)}px "Consolas","Noto Sans TC",monospace`;
    ctx.textAlign = "center";
    ctx.fillText(text || "", x + w/2, y + h*0.92);
    ctx.textAlign = "left";
  }

  /* ---------------------------------------------------------
     Main render (used for BOTH live preview and PNG export)
  --------------------------------------------------------- */
  function render(ctx, W, H){
    ctx.clearRect(0, 0, W, H);
    ctx.save();

    const radius = Math.round(H*0.06);
    roundRect(ctx, 0, 0, W, H, radius);
    ctx.clip();

    // fixed background template (flag, title, subtitle, mountain photo,
    // grid & maple-leaf watermark, bottom terms text) — embedded image, not editable
    if (bgImageReady){
      drawImageCover(ctx, bgImage, 0, 0, W, H);
    } else {
      ctx.fillStyle = "#e8ecef";
      ctx.fillRect(0,0,W,H);
    }

    // avatar box
    const ax = W*0.072, ay = H*0.283, aw = W*0.215, ah = H*0.395;
    if (state.hasAvatar && state.avatarImg){
      ctx.save();
      roundRect(ctx, ax, ay, aw, ah, 10);
      ctx.clip();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(ax, ay, aw, ah);
      drawImageCover(ctx, state.avatarImg, ax, ay, aw, ah);
      ctx.restore();
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.lineWidth = 2;
      roundRect(ctx, ax, ay, aw, ah, 10);
      ctx.stroke();
    } else {
      roundRect(ctx, ax, ay, aw, ah, 6);
      ctx.fillStyle = "#1456b8";
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = `700 ${Math.round(H*0.046)}px ${FONT_STACK}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("頭像", ax + aw/2, ay + ah/2);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }

    // fields
    const colW = W*0.275;
    drawField(ctx, W, H, "姓名", state.name, W*0.325, 0, colW);
    drawField(ctx, W, H, "性別", state.gender, W*0.632, 0, colW);
    drawField(ctx, W, H, "出生日期", formatDateDisplay(state.birth), W*0.325, 1, colW);
    drawField(ctx, W, H, "電子編號", state.eNumber, W*0.632, 1, colW);
    drawField(ctx, W, H, "簽證編號", state.visaNumber, W*0.325, 2, colW);
    drawField(ctx, W, H, "備註", state.note, W*0.632, 2, colW);

    // barcode box
    drawBarcodeBox(ctx, W, H, W*0.615, H*0.795, W*0.352, H*0.165, state.eNumber);

    ctx.restore(); // end clip

    // thin outer border on the rounded card
    ctx.strokeStyle = "rgba(0,0,0,0.08)";
    ctx.lineWidth = 2;
    roundRect(ctx, 1, 1, W-2, H-2, radius);
    ctx.stroke();
  }

  function scheduleRender(){
    generateBarcode();
    render(cardCtx, CARD_W, CARD_H);
  }

  /* ---------------------------------------------------------
     Form bindings
  --------------------------------------------------------- */
  function bindText(id, key){
    $(id).addEventListener("input", e=>{
      state[key] = e.target.value;
      scheduleRender();
    });
  }
  bindText("inpName","name");
  bindText("inpGender","gender");
  bindText("inpBirth","birth");
  bindText("inpVisaNumber","visaNumber");
  bindText("inpENumber","eNumber");
  bindText("inpNote","note");

  /* ---------------------------------------------------------
     Avatar upload + crop tool
  --------------------------------------------------------- */
  const AVATAR_W_RATIO = 0.215, AVATAR_H_RATIO = 0.395; // matches avatar box in render()
  const CROP_RATIO = (AVATAR_W_RATIO * CARD_W) / (AVATAR_H_RATIO * CARD_H); // actual pixel width/height ratio

  const cropModal = $("cropModal");
  const cropCanvas = $("cropCanvas");
  const cropCtx = cropCanvas.getContext("2d");
  const frameW = cropCanvas.width;
  const frameH = cropCanvas.height;
  const zoomSlider = $("zoomSlider");
  const avatarInput = $("avatarInput");
  const avatarThumb = $("avatarThumb");
  const btnChooseAvatar = $("btnChooseAvatar");
  const btnChangeAvatar = $("btnChangeAvatar");
  const btnRecrop = $("btnRecrop");

  let cropState = {
    img:null, scale:1, minScale:1, offsetX:0, offsetY:0, dragging:false, lastX:0, lastY:0
  };

  function clampOffsets(){
    const iw = cropState.img.width * cropState.scale;
    const ih = cropState.img.height * cropState.scale;
    const minX = frameW - iw, maxX = 0;
    const minY = frameH - ih, maxY = 0;
    cropState.offsetX = Math.min(maxX, Math.max(minX, cropState.offsetX));
    cropState.offsetY = Math.min(maxY, Math.max(minY, cropState.offsetY));
  }

  function renderCrop(){
    cropCtx.clearRect(0,0,frameW,frameH);
    cropCtx.fillStyle = "#222";
    cropCtx.fillRect(0,0,frameW,frameH);
    cropCtx.drawImage(
      cropState.img,
      cropState.offsetX, cropState.offsetY,
      cropState.img.width*cropState.scale, cropState.img.height*cropState.scale
    );
    cropCtx.strokeStyle = "#0067c0";
    cropCtx.lineWidth = 3;
    cropCtx.strokeRect(1.5,1.5,frameW-3,frameH-3);
  }

  function initCropWithImage(img){
    cropState.img = img;
    const minScale = Math.max(frameW/img.width, frameH/img.height);
    cropState.minScale = minScale;
    cropState.scale = minScale;
    cropState.offsetX = (frameW - img.width*minScale)/2;
    cropState.offsetY = (frameH - img.height*minScale)/2;
    zoomSlider.value = 0;
    renderCrop();
    cropModal.classList.remove("hidden");
  }

  function openCropModalFromFile(file){
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=> initCropWithImage(img);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function closeCropModal(){
    cropModal.classList.add("hidden");
  }

  btnChooseAvatar.addEventListener("click", ()=> avatarInput.click());
  btnChangeAvatar.addEventListener("click", ()=> avatarInput.click());
  btnRecrop.addEventListener("click", ()=>{
    if (state.avatarOriginalImg) initCropWithImage(state.avatarOriginalImg);
  });

  avatarInput.addEventListener("change", e=>{
    const file = e.target.files && e.target.files[0];
    if (file) openCropModalFromFile(file);
    avatarInput.value = "";
  });

  // drag to pan
  cropCanvas.addEventListener("pointerdown", e=>{
    if (!cropState.img) return;
    cropState.dragging = true;
    cropState.lastX = e.clientX;
    cropState.lastY = e.clientY;
    cropCanvas.setPointerCapture(e.pointerId);
    cropCanvas.style.cursor = "grabbing";
  });
  cropCanvas.addEventListener("pointermove", e=>{
    if (!cropState.dragging) return;
    const dx = e.clientX - cropState.lastX;
    const dy = e.clientY - cropState.lastY;
    cropState.lastX = e.clientX;
    cropState.lastY = e.clientY;
    cropState.offsetX += dx;
    cropState.offsetY += dy;
    clampOffsets();
    renderCrop();
  });
  function endDrag(){
    cropState.dragging = false;
    cropCanvas.style.cursor = "grab";
  }
  cropCanvas.addEventListener("pointerup", endDrag);
  cropCanvas.addEventListener("pointerleave", endDrag);
  cropCanvas.addEventListener("pointercancel", endDrag);

  zoomSlider.addEventListener("input", ()=>{
    if (!cropState.img) return;
    const val = Number(zoomSlider.value);
    const newScale = cropState.minScale + (val/100) * (cropState.minScale * 2.2);
    const cx = frameW/2, cy = frameH/2;
    const imgXBefore = (cx - cropState.offsetX) / cropState.scale;
    const imgYBefore = (cy - cropState.offsetY) / cropState.scale;
    cropState.scale = newScale;
    cropState.offsetX = cx - imgXBefore*newScale;
    cropState.offsetY = cy - imgYBefore*newScale;
    clampOffsets();
    renderCrop();
  });

  $("btnCancelCrop").addEventListener("click", closeCropModal);

  $("btnApplyCrop").addEventListener("click", ()=>{
    if (!cropState.img) { closeCropModal(); return; }
    const outW = 520;
    const outH = Math.round(outW / CROP_RATIO);
    const outCanvas = document.createElement("canvas");
    outCanvas.width = outW;
    outCanvas.height = outH;
    const octx = outCanvas.getContext("2d");
    octx.fillStyle = "#ffffff";
    octx.fillRect(0, 0, outW, outH);
    const sx = -cropState.offsetX / cropState.scale;
    const sy = -cropState.offsetY / cropState.scale;
    const sw = frameW / cropState.scale;
    const sh = frameH / cropState.scale;
    octx.drawImage(cropState.img, sx, sy, sw, sh, 0, 0, outW, outH);
    const dataUrl = outCanvas.toDataURL("image/png");

    const finalImg = new Image();
    finalImg.onload = ()=>{
      state.hasAvatar = true;
      state.avatarImg = finalImg;
      state.avatarOriginalImg = cropState.img;
      avatarThumb.src = dataUrl;
      avatarThumb.classList.remove("hidden");
      btnRecrop.classList.remove("hidden");
      btnChangeAvatar.classList.remove("hidden");
      btnChooseAvatar.classList.add("hidden");
      closeCropModal();
      scheduleRender();
    };
    finalImg.src = dataUrl;
  });

  /* ---------------------------------------------------------
     Download / print / reset
  --------------------------------------------------------- */
  function sanitizeFilename(s){
    return (s || "evisa").replace(/[^a-zA-Z0-9\-_]+/g, "-");
  }

  $("btnDownload").addEventListener("click", ()=>{
    generateBarcode();
    const scale = 2; // higher-res export
    const exportCanvas = document.createElement("canvas");
    exportCanvas.width = CARD_W * scale;
    exportCanvas.height = CARD_H * scale;
    const ectx = exportCanvas.getContext("2d");
    ectx.scale(scale, scale);
    render(ectx, CARD_W, CARD_H);
    const link = document.createElement("a");
    link.download = sanitizeFilename(state.eNumber) + ".png";
    link.href = exportCanvas.toDataURL("image/png");
    link.click();
  });

  $("btnPrint").addEventListener("click", ()=> window.print());

  $("btnReset").addEventListener("click", ()=>{
    state = Object.assign({}, defaultState);
    $("inpName").value = state.name;
    $("inpGender").value = state.gender;
    $("inpBirth").value = state.birth;
    $("inpVisaNumber").value = state.visaNumber;
    $("inpENumber").value = state.eNumber;
    $("inpNote").value = state.note;
    avatarThumb.classList.add("hidden");
    avatarThumb.src = "";
    btnRecrop.classList.add("hidden");
    btnChangeAvatar.classList.add("hidden");
    btnChooseAvatar.classList.remove("hidden");
    scheduleRender();
  });

  /* ---------------------------------------------------------
     Init
  --------------------------------------------------------- */
  document.fonts.ready.then(scheduleRender).catch(scheduleRender);
  scheduleRender();
})();
</script>
</body>
</html>
