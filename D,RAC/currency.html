<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美利幣 Meili Coin｜加拿大民主皇室聯合王國</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --paper:#F5F2EA;
  --paper-2:#EEE9DC;
  --ink:#1B2A3D;
  --ink-soft:#4B5A6C;
  --teal:#2E6E62;
  --teal-deep:#1F4F46;
  --brick:#A0483A;
  --slate:#6C7686;
  --hair:rgba(27,42,61,0.14);
  --card:#FBF9F3;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-weight:300;line-height:1.75;overflow-x:hidden;}
::selection{background:var(--teal);color:var(--paper);}
.eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.12em;color:var(--teal-deep);font-size:.95rem;text-transform:uppercase;}
h1,h2,h3{font-family:'Noto Serif TC',serif;font-weight:700;color:var(--ink);}
code,.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
img{max-width:100%;display:block;}

.strata-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(46,110,98,0.07), transparent),repeating-linear-gradient(180deg, transparent 0 140px, rgba(27,42,61,0.02) 140px 141px);}

nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;background:rgba(245,242,234,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);}
.brand{display:flex;align-items:center;gap:10px;font-family:'Noto Serif TC',serif;font-weight:700;font-size:1.05rem;letter-spacing:.02em;text-decoration:none;color:var(--ink);}
.brand img{width:30px;height:20px;object-fit:cover;border:1px solid var(--hair);border-radius:2px;}
.navlinks{display:flex;gap:26px;font-size:.88rem;}
.navlinks a{text-decoration:none;color:var(--slate);transition:color .25s;padding-bottom:4px;border-bottom:1px solid transparent;}
.navlinks a:hover,.navlinks a:focus-visible{color:var(--teal-deep);}
.navlinks a.active{color:var(--teal-deep);border-bottom-color:var(--teal);}
.discord-btn{border:1px solid var(--teal);color:var(--teal-deep);padding:8px 16px;border-radius:2px;font-size:.82rem;text-decoration:none;transition:all .25s;white-space:nowrap;}
.discord-btn:hover,.discord-btn:focus-visible{background:var(--teal);color:var(--paper);}
@media(max-width:820px){.navlinks{display:none;}}

.page-banner-plain{width:100%;max-height:260px;overflow:hidden;border-bottom:1px solid var(--hair);}
.page-banner-plain img{width:100%;height:260px;object-fit:cover;display:block;}

.discord-widget{margin:24px auto 0;display:flex;justify-content:center;}
.discord-widget iframe{border-radius:4px;max-width:100%;}

.page-head-plain{padding:52px 6vw 0;max-width:1120px;margin:0 auto;}
.page-head-plain .eyebrow{display:block;margin-bottom:10px;}
.page-head-plain h1{font-size:clamp(1.7rem,3.6vw,2.5rem);}
.page-head-plain p{color:var(--ink-soft);margin-top:14px;max-width:640px;}

.hero{min-height:auto;padding:0;position:relative;}
.hero-banner-wrap{width:100%;position:relative;}
.hero-inner{padding:64px 6vw 20px;text-align:center;max-width:820px;margin:0 auto;}
.hero-inner .eyebrow{display:block;margin-bottom:18px;}
.hero-inner h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.25;}
.hero-inner h1 span{color:var(--teal-deep);}
.hero-inner .en-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,2vw,1.3rem);color:var(--slate);margin-top:12px;}
.hero-inner p.lede{max-width:620px;margin:26px auto 0;color:var(--ink-soft);font-size:1rem;}
.hero-actions{margin-top:34px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.btn-primary{background:var(--teal);color:var(--paper);padding:13px 30px;border-radius:2px;text-decoration:none;font-weight:500;font-size:.92rem;letter-spacing:.02em;transition:transform .25s,background .25s;display:inline-block;}
.btn-primary:hover,.btn-primary:focus-visible{background:var(--teal-deep);transform:translateY(-2px);}
.btn-ghost{border:1px solid var(--hair);color:var(--ink);padding:13px 30px;border-radius:2px;text-decoration:none;font-size:.92rem;transition:border-color .25s;display:inline-block;}
.btn-ghost:hover,.btn-ghost:focus-visible{border-color:var(--teal);}

.stat-row{margin:56px auto 0;display:flex;gap:0;flex-wrap:wrap;justify-content:center;max-width:900px;padding:0 6vw;}
.stat{padding:0 30px;border-left:1px solid var(--hair);text-align:left;}
.stat:first-child{border-left:none;}
.stat .n{font-family:'Noto Serif TC',serif;font-size:1.5rem;color:var(--teal-deep);}
.stat .l{font-size:.78rem;color:var(--slate);margin-top:4px;}
@media(max-width:600px){.stat{border-left:none;border-top:1px solid var(--hair);padding:14px 20px;width:100%;text-align:center;}}

.card-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);margin:80px 6vw 0;max-width:1120px;margin-left:auto;margin-right:auto;}
.card-nav a{background:var(--card);padding:32px 28px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:10px;transition:background .25s;}
.card-nav a:hover,.card-nav a:focus-visible{background:var(--paper-2);}
.card-nav .eyebrow{font-size:.72rem;}
.card-nav h3{font-size:1.15rem;}
.card-nav p{color:var(--ink-soft);font-size:.86rem;}
.card-nav .arrow{margin-top:auto;color:var(--teal-deep);font-size:.82rem;}

section{padding:100px 6vw;max-width:1120px;margin:0 auto;}
section.tight{padding-top:56px;}
.section-head{margin-bottom:56px;max-width:640px;}
.section-head .eyebrow{display:block;margin-bottom:14px;}
.section-head h2{font-size:clamp(1.6rem,3.4vw,2.4rem);}
.section-head p{color:var(--ink-soft);margin-top:16px;font-size:.98rem;}
.divider{height:1px;background:var(--hair);max-width:1120px;margin:0 auto;}

.callout{border:1px solid var(--brick);background:rgba(160,72,58,0.06);padding:26px 30px;border-radius:2px;margin-top:36px;font-size:.92rem;color:var(--ink);}
.callout b{color:var(--brick);}

.era-strip{display:flex;height:64px;border-radius:2px;overflow:hidden;margin-bottom:64px;border:1px solid var(--hair);}
.era-seg{position:relative;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--paper);font-weight:500;cursor:default;transition:flex-grow .3s;border-right:1px solid rgba(255,255,255,0.18);}
.era-seg:last-child{border-right:none;}
.era-seg span{padding:0 6px;text-align:center;line-height:1.3;}
.era-seg:hover{flex-grow:2.2;}
.e1{background:#8B8F82;flex-grow:1.4;}
.e2{background:#748A76;flex-grow:1;}
.e3{background:#9A8558;flex-grow:1.1;}
.e4{background:#A0483A;flex-grow:1.6;}
.e5{background:#7C6A45;flex-grow:1;}
.e6{background:#2E6E62;flex-grow:2;}
.era-strip-caption{text-align:center;color:var(--slate);font-size:.78rem;margin-top:-48px;margin-bottom:64px;}

.timeline{border-left:1px solid var(--hair);padding-left:34px;position:relative;}
.tl-item{position:relative;padding-bottom:38px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:attr(data-n);position:absolute;left:-46px;top:0;width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--teal);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--teal-deep);}
.tl-item p{color:var(--ink-soft);font-size:.95rem;max-width:620px;}
.tl-item p b{color:var(--ink);font-weight:500;}

.gov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);}
.gov-card{background:var(--card);padding:30px 26px;}
.gov-card .role{font-size:.72rem;letter-spacing:.1em;color:var(--teal-deep);text-transform:uppercase;font-family:'Cormorant Garamond',serif;font-style:italic;}
.gov-card h3{font-size:1.15rem;margin-top:10px;}
.gov-card p{color:var(--ink-soft);font-size:.88rem;margin-top:8px;}

.principles{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px;}
.chip{border:1px solid var(--hair);padding:8px 16px;border-radius:20px;font-size:.82rem;color:var(--ink-soft);}
.agency-list{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;}
.agency-list span{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--ink);border:1px solid var(--hair);padding:6px 12px;background:var(--card);}

.law-search{width:100%;background:var(--card);border:1px solid var(--hair);color:var(--ink);padding:14px 18px;font-family:'Noto Sans TC',sans-serif;font-size:.95rem;border-radius:2px;margin-bottom:8px;}
.law-search::placeholder{color:var(--slate);}
.law-count{font-size:.78rem;color:var(--slate);margin-bottom:28px;}
.law-featured{border:1px solid var(--teal);background:var(--card);padding:32px;border-radius:2px;margin-bottom:44px;}
.law-featured .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--paper);background:var(--teal-deep);padding:3px 10px;border-radius:2px;margin-bottom:14px;}
.law-featured h3{font-size:1.3rem;}
.law-featured .subt{color:var(--slate);font-size:.85rem;margin-top:2px;font-style:italic;font-family:'Cormorant Garamond',serif;}
.law-featured .meta{margin-top:14px;font-size:.8rem;color:var(--slate);font-family:'JetBrains Mono',monospace;}
.law-featured ul{margin-top:18px;padding-left:20px;color:var(--ink);font-size:.92rem;}
.law-featured li{margin-bottom:8px;color:var(--ink-soft);}
.law-featured li b{color:var(--ink);font-weight:500;}
.law-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);}
.law-row{background:var(--card);padding:18px 20px;display:flex;flex-direction:column;gap:4px;transition:background .2s;}
.law-row:hover{background:var(--paper-2);}
.law-row .code{font-family:'JetBrains Mono',monospace;color:var(--teal-deep);font-size:.78rem;}
.law-row .name{font-size:.92rem;}
.law-row[hidden]{display:none;}

.currency-card{display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start;border:1px solid var(--hair);background:var(--card);padding:38px;border-radius:2px;}
.coin{width:96px;height:96px;border-radius:50%;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Noto Serif TC',serif;color:var(--teal-deep);font-size:1.1rem;font-weight:700;box-shadow:inset 0 0 0 4px rgba(46,110,98,0.1);}
.converter{flex:1;min-width:240px;}
.converter label{font-size:.8rem;color:var(--slate);display:block;margin-bottom:8px;}
.converter-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.converter input{background:var(--paper);border:1px solid var(--hair);color:var(--ink);padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:1rem;width:150px;border-radius:2px;}
.converter .eq{color:var(--slate);}
.converter .result{font-family:'JetBrains Mono',monospace;color:var(--teal-deep);font-size:1.1rem;}
.rate-note{margin-top:16px;font-size:.78rem;color:var(--slate);}

.tag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);margin-top:10px;}
.tag-card{background:var(--card);padding:26px;font-size:.9rem;color:var(--ink-soft);}
.tag-card b{display:block;color:var(--ink);font-family:'Noto Serif TC',serif;font-size:1rem;margin-bottom:8px;font-weight:600;}

footer{border-top:1px solid var(--hair);padding:60px 6vw 40px;text-align:center;color:var(--slate);font-size:.82rem;}
footer .brand{justify-content:center;margin-bottom:18px;}
footer a.discord-btn{display:inline-block;margin:18px 0 26px;}
footer .fine{max-width:560px;margin:0 auto;opacity:.85;line-height:1.7;}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;}}
</style>
</head>
