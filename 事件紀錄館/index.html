
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件紀錄館</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: black;
    color: white;
    font-family: "Courier New", monospace;
    padding: 20px;
    line-height: 1.8;
}

hr {
    border: none;
    border-top: 1px solid white;
    margin: 15px 0;
}

button {
    display: block;
    width: 100%;
    background: transparent;
    color: white;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 16px;
    text-align: left;
    padding: 9px 4px;
    cursor: pointer;
}

button:hover,
button:active,
button:focus {
    background: transparent;
    color: white;
}

button:active {
    opacity: 0.7;
}

</style>
</head>

<body>

事件紀錄館
<hr>

<button onclick="location.href='民權事件/'">民權事件</button>

<hr>

<button onclick="location.href='../index.html'">
    [ 回去 ]
</button>

</body>
</html>
